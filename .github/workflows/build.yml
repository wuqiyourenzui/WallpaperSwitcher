name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Run unit tests
      run: gradle testDebugUnitTest

    - name: Run Android Lint
      # Findings that exist today are frozen in app/lint-baseline.xml, so this
      # step fails only on NEW problems. Delete baseline entries as they get
      # fixed; never regenerate the file wholesale (that would hide everything
      # again). Reports land in app/build/reports/lint-results-debug.html.
      run: gradle lintDebug

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: wallpaper-switcher-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
